name=ProtoCentral ADS1292R ECG and Respiration boards library
version=2.0.0
author=ProtoCentral Electronics <support@protocentral.com>
maintainer=ProtoCentral Electronics <support@protocentral.com>
sentence=Driver for the TI ADS1292R ECG and respiration AFE on the ProtoCentral ADS1292R Breakout and Shield.
paragraph=Reads ECG and impedance-pneumography respiration at 125 SPS to 8 kSPS, with lead-off detection, test signal, on-die temperature, supply monitoring, GPIO and multi-board clock sync. Includes optional fixed-point heart-rate and respiration-rate algorithms that fit on an Arduino Uno, and a ProtoCentral OpenView streaming example. For research and education only - not a medical device.
